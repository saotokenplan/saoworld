name: CD

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push All Services
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Deploying version $VERSION"

          for service in vote world content generation review gateway player ops; do
            echo "Building services/$service..."
            docker build -t ${{ secrets.DOCKER_REGISTRY }}/${service}-service:$VERSION services/$service
            docker push ${{ secrets.DOCKER_REGISTRY }}/${service}-service:$VERSION
          done

          echo "Building workers..."
          docker build -t ${{ secrets.DOCKER_REGISTRY }}/game-workers:$VERSION workers
          docker push ${{ secrets.DOCKER_REGISTRY }}/game-workers:$VERSION

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/game-server
            git fetch origin
            git checkout ${{ github.ref }}
            VERSION=${GITHUB_REF#refs/tags/v}
            sed -i "s/IMAGE_VERSION=.*/IMAGE_VERSION=$VERSION/" .env
            docker compose -f docker-compose.prod.yml up -d
            sleep 30
            curl -s http://localhost:8080/api/v1/health

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Rollback to Previous Version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/game-server
            PREV_VERSION=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1))
            echo "Rolling back to $PREV_VERSION"
            sed -i "s/IMAGE_VERSION=.*/IMAGE_VERSION=${PREV_VERSION#v}/" .env
            docker compose -f docker-compose.prod.yml up -d
            sleep 30
            curl -s http://localhost:8080/api/v1/health