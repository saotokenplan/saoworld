name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
      release_mode:
        description: 'Release mode: gray or full'
        required: true
        default: 'gray'
        type: choice
        options:
          - gray
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push All Services
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Building version $VERSION"

          for service in vote world content generation review gateway player ops; do
            echo "Building services/$service..."
            docker build -t ${{ secrets.DOCKER_REGISTRY }}/${service}-service:$VERSION services/$service
            docker push ${{ secrets.DOCKER_REGISTRY }}/${service}-service:$VERSION
          done

          echo "Building workers..."
          docker build -t ${{ secrets.DOCKER_REGISTRY }}/game-workers:$VERSION workers
          docker push ${{ secrets.DOCKER_REGISTRY }}/game-workers:$VERSION

  gray-release:
    name: Gray Release
    runs-on: ubuntu-latest
    environment: staging
    needs: build-and-push
    if: ${{ github.event.inputs.release_mode == 'gray' || (!github.event.inputs.release_mode && startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Gray Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GRAY_SERVER_HOST }}
          username: ${{ secrets.GRAY_SERVER_USER }}
          key: ${{ secrets.GRAY_SERVER_SSH_KEY }}
          script: |
            cd /opt/game-server-gray
            VERSION=${{ steps.version.outputs.version }}
            sed -i "s/IMAGE_VERSION=.*/IMAGE_VERSION=$VERSION/" .env
            docker compose -f docker-compose.prod.yml up -d
            sleep 30
            curl -s http://localhost:8080/api/v1/health

      - name: Verify Gray Release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GRAY_SERVER_HOST }}
          username: ${{ secrets.GRAY_SERVER_USER }}
          key: ${{ secrets.GRAY_SERVER_SSH_KEY }}
          script: |
            cd /opt/game-server-gray
            bash tools/health-check.sh

  promote-to-full:
    name: Promote to Full Release
    runs-on: ubuntu-latest
    environment: production
    needs: gray-release
    if: ${{ github.event.inputs.release_mode == 'full' }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/game-server
            VERSION=${{ steps.version.outputs.version }}
            sed -i "s/IMAGE_VERSION=.*/IMAGE_VERSION=$VERSION/" .env
            docker compose -f docker-compose.prod.yml up -d
            sleep 30
            curl -s http://localhost:8080/api/v1/health

      - name: Verify Production Release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/game-server
            bash tools/health-check.sh

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'rollback' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rollback to Previous Version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/game-server
            PREV_VERSION=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1))
            echo "Rolling back to $PREV_VERSION"
            sed -i "s/IMAGE_VERSION=.*/IMAGE_VERSION=${PREV_VERSION#v}/" .env
            docker compose -f docker-compose.prod.yml up -d
            sleep 30
            curl -s http://localhost:8080/api/v1/health

      - name: Verify Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/game-server
            bash tools/health-check.sh