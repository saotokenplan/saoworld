name: CI

on:
  push:
    branches: [main, develop, feature-prd, 'auto/**']
  pull_request:
    branches: [main, develop, feature-prd]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, world, content, generation, review, gateway, player, ops, workers]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          ruff check .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, world, content, generation, review, gateway, player, ops, workers]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          pip install -e ".[dev]"

      - name: Run mypy
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          ${{ matrix.service == 'workers' && 'mypy .' || 'mypy app' }}

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, world, content, generation, review, gateway, player, ops, workers]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          pytest -v --tb=short

  content-check:
    name: Content Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install content check dependencies
        run: |
          pip install -e "tools/content_check[dev]"

      - name: Run world consistency check
        run: |
          python -m pytest tools/content_check/tests/test_world_consistency.py -v

      - name: Run reward boundary check
        run: |
          python -m pytest tools/content_check/tests/test_reward_boundary.py -v

      - name: Run content safety check
        run: |
          python -m pytest tools/content_check/tests/test_content_safety.py -v

      - name: Run duplication check
        run: |
          python -m pytest tools/content_check/tests/test_duplication.py -v

  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install playtest dependencies
        run: |
          pip install -e "tools/playtest[dev]"

      - name: Run E2E tests
        run: |
          python -m pytest tools/playtest/ -v --tb=short

  check-docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown syntax
        run: |
          find docs -name "*.md" -exec md5sum {} \; | sort

      - name: Check auto-plan files
        run: |
          ls -la docs/40-dev-loop/auto-plan-*.md | head -20