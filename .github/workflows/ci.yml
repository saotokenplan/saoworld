name: CI

on:
  push:
    branches: [main, develop, feature-prd, 'auto/**']
  pull_request:
    branches: [main, develop, feature-prd]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, world, content, generation, review, gateway, player, ops, workers]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          ruff check .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, world, content, generation, review, gateway, player, ops, workers]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          pip install -e ".[dev]"

      - name: Run mypy
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          mypy app || true

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, world, content, generation, review, gateway, player, ops, workers]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          cd ${{ matrix.service == 'workers' && 'workers' || format('services/{0}', matrix.service) }}
          pytest -v --tb=short

  check-docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown syntax
        run: |
          find docs -name "*.md" -exec md5sum {} \; | sort

      - name: Check auto-plan files
        run: |
          ls -la docs/40-dev-loop/auto-plan-*.md | head -20