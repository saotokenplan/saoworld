name: CI

on:
  push:
    branches: [main, develop, feature-prd, 'auto/**']
  pull_request:
    branches: [main, develop, feature-prd]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, world, content, generation, review, gateway, player, ops, workers, content_check, loop_logging, agents, playtest, perf_test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ "${{ matrix.service }}" = "workers" ]; then
            cd workers
          elif [[ "${{ matrix.service }}" =~ ^(content_check|loop_logging|agents|playtest|perf_test)$ ]]; then
            cd tools/${{ matrix.service }}
          else
            cd services/${{ matrix.service }}
          fi
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          if [ "${{ matrix.service }}" = "workers" ]; then
            cd workers
          elif [[ "${{ matrix.service }}" =~ ^(content_check|loop_logging|agents|playtest|perf_test)$ ]]; then
            cd tools/${{ matrix.service }}
          else
            cd services/${{ matrix.service }}
          fi
          ruff check .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, world, content, generation, review, gateway, player, ops, workers, content_check, loop_logging, agents, playtest, perf_test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ "${{ matrix.service }}" = "workers" ]; then
            cd workers
          elif [[ "${{ matrix.service }}" =~ ^(content_check|loop_logging|agents|playtest|perf_test)$ ]]; then
            cd tools/${{ matrix.service }}
          else
            cd services/${{ matrix.service }}
          fi
          pip install -e ".[dev]"

      - name: Run mypy
        run: |
          if [ "${{ matrix.service }}" = "workers" ]; then
            cd workers && mypy .
          elif [[ "${{ matrix.service }}" =~ ^(content_check|loop_logging|agents|playtest|perf_test)$ ]]; then
            cd tools/${{ matrix.service }} && mypy .
          else
            cd services/${{ matrix.service }} && mypy app
          fi

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, world, content, generation, review, gateway, player, ops, workers, content_check, loop_logging, agents, perf_test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ "${{ matrix.service }}" = "workers" ]; then
            cd workers
          elif [[ "${{ matrix.service }}" =~ ^(content_check|loop_logging|agents|perf_test)$ ]]; then
            cd tools/${{ matrix.service }}
          else
            cd services/${{ matrix.service }}
          fi
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          if [ "${{ matrix.service }}" = "workers" ]; then
            cd workers && pytest -v --tb=short
          elif [[ "${{ matrix.service }}" =~ ^(content_check|loop_logging|perf_test)$ ]]; then
            cd tools/${{ matrix.service }} && pytest -v --tb=short
          elif [ "${{ matrix.service }}" = "agents" ]; then
            cd tools/agents
            for d in */tests; do
              agent_dir=$(dirname "$d")
              echo "Running tests for $agent_dir"
              (cd "$agent_dir" && pytest -v --tb=short)
            done
          else
            cd services/${{ matrix.service }} && pytest -v --tb=short
          fi

  content-check:
    name: Content Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install content check dependencies
        run: |
          cd tools/content_check
          pip install -e ".[dev]"

      - name: Run content check tests
        run: |
          cd tools/content_check
          pytest -v --tb=short

  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend service dependencies
        run: |
          for service in vote world content generation review player ops gateway; do
            cd services/$service
            pip install -e ".[dev]"
            cd ../..
          done

      - name: Install playtest dependencies
        run: |
          cd tools/playtest
          pip install -e ".[dev]"

      - name: Run E2E tests
        run: |
          cd tools/playtest
          pytest -v --tb=short

  check-docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown syntax
        run: |
          find docs -name "*.md" -exec md5sum {} \; | sort

      - name: Check auto-plan files
        run: |
          ls -la docs/40-dev-loop/auto-plan-*.md | head -20