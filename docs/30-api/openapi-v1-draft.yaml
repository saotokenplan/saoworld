openapi: 3.1.0
info:
  title: AI Game MVP API Draft
  version: 0.1.0-draft
  description: >
    首版单文件 OpenAPI 草案，覆盖投票、内容更新、发布回滚、世界查询、
    任务查询和部分运营审核接口。当前仍为文档级草案收敛结果，接口边界、
    服务职责和数据约束仍以上游规范为准。
servers:
  - url: https://api.example.com
    description: production placeholder
security:
  - bearerAuth: []
tags:
  - name: votes
    description: 玩家投票周期、投票提交、历史结果与运营投票周期管理
  - name: content
    description: 内容更新、内容包查询、发布与回滚
  - name: world
    description: 世界区域查询
  - name: quests
    description: 玩家任务查询
  - name: ops
    description: 运营侧写接口
  - name: review
    description: 内容审核批准接口
paths:
  /api/v1/votes/current:
    get:
      tags: [votes]
      summary: 获取当前投票周期和候选项
      operationId: getCurrentVoteCycle
      responses:
        '200':
          description: 返回当前投票周期、候选项和玩家上下文
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteCurrentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 当前不存在有效投票周期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 当前投票周期状态不可投票
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/votes/submit:
    post:
      tags: [votes]
      summary: 提交玩家投票
      operationId: submitVote
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteSubmitRequest'
      responses:
        '200':
          description: 投票受理成功或命中幂等重放
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteSubmitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/votes/history:
    get:
      tags: [votes]
      summary: 获取历史投票结果与落地情况
      operationId: getVoteHistory
      parameters:
        - $ref: '#/components/parameters/ChapterId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 返回分页历史投票结果
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/content/updates:
    get:
      tags: [content]
      summary: 获取当前玩家可见的新内容包
      operationId: getContentUpdates
      responses:
        '200':
          description: 返回当前玩家可见的内容更新列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentUpdatesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/content/packages/{content_package_id}:
    get:
      tags: [content]
      summary: 获取内容包摘要
      operationId: getContentPackage
      parameters:
        - $ref: '#/components/parameters/ContentPackageId'
      responses:
        '200':
          description: 返回内容包摘要和当前可见状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentPackageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/ops/content-packages/{id}/release:
    post:
      tags: [ops, content]
      summary: 发布内容包
      operationId: releaseContentPackage
      parameters:
        - $ref: '#/components/parameters/OpsContentPackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseContentPackageRequest'
      responses:
        '200':
          description: 内容包发布请求受理成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseContentPackageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/ops/content-packages/{id}/rollback:
    post:
      tags: [ops, content]
      summary: 回滚内容包
      operationId: rollbackContentPackage
      parameters:
        - $ref: '#/components/parameters/OpsContentPackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackContentPackageRequest'
      responses:
        '200':
          description: 内容包回滚请求受理成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackContentPackageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/world/regions:
    get:
      tags: [world]
      summary: 获取当前可见区域列表
      operationId: getVisibleRegions
      responses:
        '200':
          description: 返回当前玩家可见区域列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/world/regions/{region_id}:
    get:
      tags: [world]
      summary: 获取区域详情和状态
      operationId: getRegionDetail
      parameters:
        - $ref: '#/components/parameters/RegionId'
      responses:
        '200':
          description: 返回区域详情和当前状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/quests:
    get:
      tags: [quests]
      summary: 获取玩家任务列表
      operationId: getQuestList
      responses:
        '200':
          description: 返回玩家任务列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/ops/vote-cycles:
    post:
      tags: [ops, votes]
      summary: 创建投票周期
      operationId: createVoteCycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoteCycleRequest'
      responses:
        '200':
          description: 投票周期创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVoteCycleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/ops/review/{object_id}/approve:
    post:
      tags: [review, ops]
      summary: 批准内容对象
      operationId: approveReviewObject
      parameters:
        - $ref: '#/components/parameters/ReviewObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewApproveRequest'
      responses:
        '200':
          description: 审核批准请求受理成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewApproveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    X-Request-Id:
      description: 服务端生成的请求追踪 ID
      schema:
        type: string
    Idempotency-Key:
      description: 提交投票时的幂等键
      schema:
        type: string
  parameters:
    ChapterId:
      name: chapter_id
      in: query
      required: false
      schema:
        type: string
      description: 按章节过滤历史投票结果
    ContentPackageId:
      name: content_package_id
      in: path
      required: true
      schema:
        type: string
      description: 内容包 ID
    RegionId:
      name: region_id
      in: path
      required: true
      schema:
        type: string
      description: 区域 ID
    ReviewObjectId:
      name: object_id
      in: path
      required: true
      schema:
        type: string
      description: 审核对象 ID
    OpsContentPackageId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 运营接口中的内容包 ID
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: 请求参数或请求体不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未认证或 Token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 当前角色无权限执行该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 目标对象不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 当前状态与操作发生冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 服务暂不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: INVALID_VOTE_STATE
        message:
          type: string
          example: 当前投票周期不可投票
        request_id:
          type: string
          example: req_vote_current_409
    VoteCycle:
      type: object
      required: [vote_cycle_id, chapter_id, status, starts_at, ends_at]
      properties:
        vote_cycle_id:
          type: string
        chapter_id:
          type: string
        status:
          type: string
          enum: [open, closed, finalized]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    VotePlayerContext:
      type: object
      required: [player_id, eligible, has_voted, vote_weight]
      properties:
        player_id:
          type: string
        eligible:
          type: boolean
        reason:
          type: string
          nullable: true
        has_voted:
          type: boolean
        vote_weight:
          type: number
          format: float
    VoteCandidate:
      type: object
      required: [candidate_id, title, summary, region_scope, risk_tags]
      properties:
        candidate_id:
          type: string
        title:
          type: string
        summary:
          type: string
        region_scope:
          type: array
          items:
            type: string
        risk_tags:
          type: array
          items:
            type: string
    VoteCurrentResponse:
      type: object
      required: [request_id, vote_cycle, player_context, candidates]
      properties:
        request_id:
          type: string
        vote_cycle:
          $ref: '#/components/schemas/VoteCycle'
        player_context:
          $ref: '#/components/schemas/VotePlayerContext'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/VoteCandidate'
    VoteSubmitRequest:
      type: object
      required: [vote_cycle_id, candidate_id]
      properties:
        vote_cycle_id:
          type: string
        candidate_id:
          type: string
    VoteSubmitResponse:
      type: object
      required: [request_id, vote_id, vote_cycle_id, candidate_id, accepted, submitted_at]
      properties:
        request_id:
          type: string
        vote_id:
          type: string
        vote_cycle_id:
          type: string
        candidate_id:
          type: string
        accepted:
          type: boolean
        weight:
          type: number
          format: float
        idempotent_replay:
          type: boolean
          default: false
        submitted_at:
          type: string
          format: date-time
    VoteHistoryCandidate:
      type: object
      required: [candidate_id, title, vote_percent]
      properties:
        candidate_id:
          type: string
        title:
          type: string
        vote_percent:
          type: number
          format: float
    VoteHistoryDelivery:
      type: object
      required: [status, content_package_id, affected_regions]
      properties:
        status:
          type: string
          enum: [pending, gray, live, rolled_back]
        content_package_id:
          type: string
        affected_regions:
          type: array
          items:
            type: string
    VoteHistoryItem:
      type: object
      required:
        [vote_cycle_id, chapter_id, closed_at, winner_candidate_id, winner_title, total_votes, candidates, delivery]
      properties:
        vote_cycle_id:
          type: string
        chapter_id:
          type: string
        closed_at:
          type: string
          format: date-time
        winner_candidate_id:
          type: string
        winner_title:
          type: string
        total_votes:
          type: integer
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/VoteHistoryCandidate'
        delivery:
          $ref: '#/components/schemas/VoteHistoryDelivery'
    VoteHistoryResponse:
      type: object
      required: [request_id, page, page_size, total, items]
      properties:
        request_id:
          type: string
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/VoteHistoryItem'
    ContentUpdateItem:
      type: object
      required: [content_package_id, published_at, affected_regions, gray_visible]
      properties:
        content_package_id:
          type: string
        title:
          type: string
        summary:
          type: string
        published_at:
          type: string
          format: date-time
        affected_regions:
          type: array
          items:
            type: string
        gray_visible:
          type: boolean
    ContentUpdatesResponse:
      type: object
      required: [request_id, items]
      properties:
        request_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentUpdateItem'
    ContentPackageSummary:
      type: object
      required: [content_package_id, status, published_at, affected_regions]
      properties:
        content_package_id:
          type: string
        title:
          type: string
        summary:
          type: string
        status:
          type: string
          enum: [packaged, gray, live, archived, rolled_back]
        published_at:
          type: string
          format: date-time
        affected_regions:
          type: array
          items:
            type: string
        gray_scope:
          $ref: '#/components/schemas/GrayScope'
    ContentPackageResponse:
      type: object
      required: [request_id, content_package]
      properties:
        request_id:
          type: string
        content_package:
          $ref: '#/components/schemas/ContentPackageSummary'
    GrayScope:
      type: object
      properties:
        region_ids:
          type: array
          items:
            type: string
        player_percent:
          type: integer
          minimum: 0
          maximum: 100
    ReleaseContentPackageRequest:
      type: object
      required: [gray_scope, reason]
      properties:
        gray_scope:
          $ref: '#/components/schemas/GrayScope'
        reason:
          type: string
    ReleaseContentPackageResponse:
      type: object
      required: [request_id, content_package_id, status, release_mode]
      properties:
        request_id:
          type: string
        content_package_id:
          type: string
        status:
          type: string
          enum: [gray, live]
        release_mode:
          type: string
          enum: [gray, full]
        released_at:
          type: string
          format: date-time
    RollbackContentPackageRequest:
      type: object
      required: [target_version, reason]
      properties:
        target_version:
          type: string
        reason:
          type: string
    RollbackContentPackageResponse:
      type: object
      required: [request_id, rollback_id, content_package_id, target_version, status]
      properties:
        request_id:
          type: string
        rollback_id:
          type: string
        content_package_id:
          type: string
        target_version:
          type: string
        status:
          type: string
          enum: [queued, running, completed]
        rolled_back_at:
          type: string
          format: date-time
    RegionSummary:
      type: object
      required: [region_id, chapter_id, title, status, visible]
      properties:
        region_id:
          type: string
        chapter_id:
          type: string
        title:
          type: string
        summary:
          type: string
        status:
          type: string
          enum: [locked, active, unstable, archived]
        visible:
          type: boolean
    RegionListResponse:
      type: object
      required: [request_id, items]
      properties:
        request_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegionSummary'
    RegionDetailResponse:
      type: object
      required: [request_id, region]
      properties:
        request_id:
          type: string
        region:
          $ref: '#/components/schemas/RegionSummary'
    QuestItem:
      type: object
      required: [quest_id, chapter_id, active_region_id, title, status]
      properties:
        quest_id:
          type: string
        chapter_id:
          type: string
        active_region_id:
          type: string
        title:
          type: string
        summary:
          type: string
        status:
          type: string
          enum: [available, active, completed, failed]
    QuestListResponse:
      type: object
      required: [request_id, items]
      properties:
        request_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuestItem'
    CreateVoteCycleRequest:
      type: object
      required: [chapter_id, starts_at, ends_at, candidate_ids, reason]
      properties:
        chapter_id:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        candidate_ids:
          type: array
          minItems: 1
          items:
            type: string
        reason:
          type: string
    CreateVoteCycleResponse:
      type: object
      required: [request_id, vote_cycle_id, status]
      properties:
        request_id:
          type: string
        vote_cycle_id:
          type: string
        status:
          type: string
          enum: [draft, scheduled, open]
    ReviewApproveRequest:
      type: object
      required: [review_result, reason]
      properties:
        review_result:
          type: string
          enum: [approved, manual_review]
        reason:
          type: string
    ReviewApproveResponse:
      type: object
      required: [request_id, review_id, object_id, review_result, reviewed_at]
      properties:
        request_id:
          type: string
        review_id:
          type: string
        object_id:
          type: string
        review_result:
          type: string
        reviewed_at:
          type: string
          format: date-time
