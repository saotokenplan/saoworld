  schemas:
    ErrorCode:
      type: string
      pattern: '^[A-Z0-9_]+$'
      example: INVALID_VOTE_STATE
    GenericErrorCode:
      type: string
      enum:
        - INVALID_ARGUMENT
        - INVALID_TOKEN
        - TOKEN_EXPIRED
        - INSUFFICIENT_SCOPE
        - RESOURCE_NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
      description: >
        HTTP 语义层通用错误码，跨接口稳定，可被 SDK、Mock Server 和测试工具直接匹配。
        领域专属错误码（如 VOTE_CYCLE_NOT_FOUND）仍使用 ErrorCode 的开放 pattern 校验。
    RequestId:
      type: string
      pattern: '^req_[A-Za-z0-9_]+$'
      example: req_vote_current_409
    TraceId:
      type: string
      pattern: '^trace_[A-Za-z0-9_]+$'
      example: trace_vote_submit_001
    ErrorMessage:
      type: string
      minLength: 1
      example: 当前投票周期不可投票
    ErrorDetailLocation:
      type: string
      enum: [query, path, header, body]
    ValidationIssue:
      type: string
      enum:
        - required
        - pattern_mismatch
        - unsupported_enum
        - must_be_between_1_and_100
        - min_items_2
      description: 参数校验类错误的 issue 枚举，供 SDK 做表单级错误映射
    AuthorizationIssue:
      type: string
      enum:
        - missing_required_scope
      description: 鉴权/授权类错误的 issue 枚举
    ErrorDetailIssue:
      type: string
      oneOf:
        - $ref: '#/components/schemas/ValidationIssue'
        - $ref: '#/components/schemas/AuthorizationIssue'
      description: 错误细节原因码，按类别分组成稳定枚举
    ErrorFieldPath:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_.-]*$'
      example: gray_scope.player_percent
      description: 错误字段路径；不同 location 的 field 格式见各特化 detail 类型
    PathFieldName:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      example: region_id
      description: 路径参数字段名，snake_case 无嵌套
    QueryFieldName:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      example: page_size
      description: 查询参数字段名，snake_case 无嵌套
    BodyFieldPath:
      type: string
      pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
      example: gray_scope.player_percent
      description: 请求体字段路径，snake_case，支持点号表示嵌套对象（如 gray_scope.player_percent）
    HeaderFieldName:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9-]*$'
      example: Authorization
      description: 请求头字段名，遵循 HTTP header 命名规范
    RejectedValue:
      description: 被服务端拒绝的实际入参值；支持任意 JSON 标量类型，方便 SDK 回显
      oneOf:
        - type: string
        - type: integer
        - type: number
        - type: boolean
        - type: 'null'
    ErrorResponseBase:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
        request_id:
          $ref: '#/components/schemas/RequestId'
    ErrorDetail:
      type: object
      required: [location, field, issue]
      properties:
        location:
          $ref: '#/components/schemas/ErrorDetailLocation'
        field:
          $ref: '#/components/schemas/ErrorFieldPath'
        issue:
          $ref: '#/components/schemas/ErrorDetailIssue'
        rejected_value:
          $ref: '#/components/schemas/RejectedValue'
    ValidationErrorDetail:
      allOf:
        - $ref: '#/components/schemas/ErrorDetail'
        - type: object
          properties:
            issue:
              $ref: '#/components/schemas/ValidationIssue'
      description: 参数校验错误条目；issue 收窄为校验类枚举，Mock/SDK 可直接映射表单错误
    PathParameterErrorDetail:
      allOf:
        - $ref: '#/components/schemas/ErrorDetail'
        - type: object
          required: [location]
          properties:
            location:
              type: string
              enum: [path]
            field:
              $ref: '#/components/schemas/PathFieldName'
            issue:
              type: string
              enum: [pattern_mismatch]
      description: 路径参数格式错误条目；location 固定为 path，field 为路径参数名（snake_case），issue 固定为 pattern_mismatch
    ScopeErrorDetail:
      allOf:
        - $ref: '#/components/schemas/ErrorDetail'
        - type: object
          required: [location]
          properties:
            location:
              type: string
              enum: [header]
            field:
              type: string
              enum: [Authorization]
            issue:
              $ref: '#/components/schemas/AuthorizationIssue'
      description: Scope 不足错误条目；固定指向 Authorization 头，issue 固定为 missing_required_scope
    DetailedErrorResponseBase:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          properties:
            details:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ErrorDetail'
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/DetailedErrorResponseBase'
      description: 通用错误响应；所有接口错误响应均兼容此结构
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [INVALID_ARGUMENT]
            details:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ValidationErrorDetail'
      description: 参数校验错误响应（400）；code 固定为 INVALID_ARGUMENT，details 为校验条目数组
    PathParameterErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [INVALID_ARGUMENT]
            details:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/PathParameterErrorDetail'
      description: 路径参数错误响应（400）；details 只含一个 path 级 pattern_mismatch 条目
    ScopeErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [INSUFFICIENT_SCOPE]
            details:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/ScopeErrorDetail'
      description: Scope 不足错误响应（403）；details 只含一个 Authorization 头 scope 缺失条目
    UnauthorizedErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [INVALID_TOKEN]
      description: 未认证错误响应（401）
    TokenExpiredErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [TOKEN_EXPIRED]
      description: Token 过期错误响应（401）；与 INVALID_TOKEN 区分，提示客户端刷新 Access Token
    NotFoundErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [RESOURCE_NOT_FOUND]
      description: 资源不存在错误响应（404）
    ConflictErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [CONFLICT]
      description: 状态冲突错误响应（409）
    RateLimitedErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [RATE_LIMITED]
      description: 限流错误响应（429）
    ServiceUnavailableErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [SERVICE_UNAVAILABLE]
      description: 服务不可用错误响应（503）
    ReasonRequiredErrorDetail:
      allOf:
        - $ref: '#/components/schemas/ErrorDetail'
        - type: object
          required: [location, field, issue]
          properties:
            location:
              type: string
              enum: [body]
            field:
              type: string
              enum: [reason]
            issue:
              type: string
              enum: [required]
      description: 敏感操作缺少 reason 字段的错误条目；固定指向 body.reason，issue=required
    ReasonRequiredErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [REASON_REQUIRED]
            details:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/ReasonRequiredErrorDetail'
      description: 敏感操作缺少原因字段错误响应（400）；所有运营写接口必填 reason，固定返回此结构
    OpsWriteValidationErrorResponse:
      oneOf:
        - $ref: '#/components/schemas/ValidationErrorResponse'
        - $ref: '#/components/schemas/ReasonRequiredErrorResponse'
      description: 运营写接口 400 响应的联合类型：参数校验错误或 reason 字段缺失
    DomainServiceUnavailableErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponseBase'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              pattern: '^[A-Z0-9_]+_UNAVAILABLE$'
      description: 领域级 503 错误响应（如 CONTENT_UPDATES_UNAVAILABLE、QUEST_LIST_UNAVAILABLE）；code 以 _UNAVAILABLE 结尾，标识特定下游或域暂不可用
    VoteCycle:
      type: object
      required: [vote_cycle_id, chapter_id, status, starts_at, ends_at]
      properties:
        vote_cycle_id:
          type: string
        chapter_id:
          type: string
        status:
          type: string
          enum: [open, closed, finalized]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    VotePlayerContext:
      type: object
      required: [player_id, eligible, has_voted, vote_weight]
      properties:
        player_id:
          type: string
        eligible:
          type: boolean
        reason:
          type: string
          nullable: true
        has_voted:
          type: boolean
        vote_weight:
          type: number
          format: float
    VoteCandidate:
      type: object
      required: [candidate_id, title, summary, region_scope, risk_tags]
      properties:
        candidate_id:
          type: string
        title:
          type: string
        summary:
          type: string
        region_scope:
          type: array
          items:
            type: string
        risk_tags:
          type: array
          items:
            type: string
    VoteCurrentData:
      type: object
      required: [vote_cycle, player_context, candidates]
      properties:
        vote_cycle:
          $ref: '#/components/schemas/VoteCycle'
        player_context:
          $ref: '#/components/schemas/VotePlayerContext'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/VoteCandidate'
    VoteCurrentResponse:
      allOf:
        - $ref: '#/components/schemas/DetailResponseBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/VoteCurrentData'
    VoteSubmitRequest:
      type: object
      required: [vote_cycle_id, candidate_id]
      properties:
        vote_cycle_id:
          type: string
        candidate_id:
          type: string
    VoteSubmitResult:
      type: object
      required: [vote_id, vote_cycle_id, candidate_id, accepted, submitted_at]
      properties:
        vote_id:
          type: string
        vote_cycle_id:
          type: string
        candidate_id:
          type: string
        accepted:
          type: boolean
        weight:
          type: number
          format: float
        submitted_at:
          type: string
          format: date-time
    VoteSubmitResponse:
      allOf:
        - $ref: '#/components/schemas/OperationResponseBase'
        - type: object
          required: [data]
          properties:
