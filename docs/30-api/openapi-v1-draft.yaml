        认证方式为 OIDC 签发的 JWT Bearer Token，通过 Authorization: Bearer <token> 头发送。
        各接口通过 security 显式声明所需 scope，并通过 x-roles 标注允许角色集合。
      x-scopes:
        votes:read: 查询当前投票周期与候选项
        votes:submit: 提交玩家投票
        votes:history:read: 查询历史投票结果
        content:read: 查询内容更新与内容包摘要
        content:release: 发布内容包
        content:rollback: 回滚内容包
        world:read: 查询世界区域
        quests:read: 查询玩家任务列表
        ops:vote-cycles:write: 创建投票周期
        review:approve: 批准审核对象
  headers:
    X-Request-Id:
      description: 服务端生成的请求追踪 ID
      schema:
        type: string
    X-Trace-Id:
      description: 链路追踪 ID；由调用方透传或由网关生成
      schema:
        type: string
    Idempotency-Key:
      description: 提交投票时的幂等键
      schema:
        type: string
  parameters:
    ChapterId:
      name: chapter_id
      in: query
      required: false
