          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuestItem'
    CreateVoteCycleRequest:
      type: object
      required: [chapter_id, starts_at, ends_at, candidate_ids, reason]
      properties:
        chapter_id:
