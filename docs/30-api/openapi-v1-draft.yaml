openapi: 3.1.0
info:
  title: AI Game MVP API Draft
  version: 0.1.0-draft
  description: >
    首版单文件 OpenAPI 草案，覆盖投票、内容更新、发布回滚、世界查询、
    任务查询和部分运营审核接口。当前仍为文档级草案收敛结果，接口边界、
    服务职责和数据约束仍以上游规范为准。
servers:
  - url: https://api.example.com
    description: production placeholder
security:
  - bearerAuth: []
tags:
  - name: votes
    description: 玩家投票周期、投票提交、历史结果与运营投票周期管理
  - name: content
    description: 内容更新、内容包查询、发布与回滚
  - name: world
    description: 世界区域查询
  - name: quests
    description: 玩家任务查询
  - name: ops
    description: 运营侧写接口
  - name: review
    description: 内容审核批准接口
paths:
  /api/v1/votes/current:
    get:
      tags: [votes]
      summary: 获取当前投票周期和候选项
      operationId: getCurrentVoteCycle
      security:
        - bearerAuth: [votes:read]
      x-roles: [player, system]
      responses:
        '200':
          description: 返回当前投票周期、候选项和玩家上下文
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteCurrentResponse'
              examples:
                success:
                  $ref: '#/components/examples/VoteCurrentSuccess'
        '403':
          description: 当前访问令牌缺少投票查询作用域
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientScope:
                  $ref: '#/components/examples/InsufficientScopeError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 当前不存在有效投票周期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                voteCycleNotFound:
                  $ref: '#/components/examples/VoteCycleNotFoundError'
        '409':
          description: 当前投票周期状态不可投票
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidVoteState:
                  $ref: '#/components/examples/InvalidVoteStateError'
  /api/v1/votes/submit:
    post:
      tags: [votes]
      summary: 提交玩家投票
      operationId: submitVote
      security:
        - bearerAuth: [votes:submit]
      x-roles: [player]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteSubmitRequest'
            examples:
              submitVote:
                $ref: '#/components/examples/VoteSubmitRequest'
      responses:
        '200':
          description: 投票受理成功或命中幂等重放
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteSubmitResponse'
              examples:
                accepted:
                  $ref: '#/components/examples/VoteSubmitSuccess'
                idempotentReplay:
                  $ref: '#/components/examples/VoteSubmitIdempotentReplay'
        '400':
          description: 投票请求参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRequest:
                  $ref: '#/components/examples/VoteSubmitInvalidArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前玩家不可执行投票
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                playerNotEligible:
                  $ref: '#/components/examples/PlayerNotEligibleError'
                voteRiskBlocked:
                  $ref: '#/components/examples/VoteRiskBlockedError'
                insufficientScope:
                  $ref: '#/components/examples/InsufficientScopeError'
        '404':
          description: 投票周期或候选项不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                voteCycleNotFound:
                  $ref: '#/components/examples/VoteCycleNotFoundError'
                candidateNotFound:
                  $ref: '#/components/examples/CandidateNotFoundError'
        '409':
          description: 投票状态与当前操作冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                voteCycleClosed:
                  $ref: '#/components/examples/VoteCycleClosedError'
                candidateOutOfScope:
                  $ref: '#/components/examples/CandidateOutOfScopeError'
                duplicateVote:
                  $ref: '#/components/examples/DuplicateVoteError'
        '429':
          description: 投票请求频率超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rateLimited:
                  $ref: '#/components/examples/VoteRateLimitedError'
  /api/v1/votes/history:
    get:
      tags: [votes]
      summary: 获取历史投票结果与落地情况
      operationId: getVoteHistory
      security:
        - bearerAuth: [votes:history:read]
      x-roles: [player, ops]
      parameters:
        - $ref: '#/components/parameters/ChapterId'
        - $ref: '#/components/parameters/RegionIdFilter'
        - $ref: '#/components/parameters/VoteCycleIdFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 返回分页历史投票结果
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteHistoryResponse'
              examples:
                success:
                  $ref: '#/components/examples/VoteHistorySuccess'
                empty:
                  $ref: '#/components/examples/VoteHistoryEmptySuccess'
                pageBoundary:
                  $ref: '#/components/examples/VoteHistoryPageBoundarySuccess'
        '400':
          description: 查询参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPagination:
                  $ref: '#/components/examples/InvalidPaginationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前访问令牌缺少历史结果查询作用域
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientScope:
                  $ref: '#/components/examples/InsufficientScopeError'
  /api/v1/content/updates:
    get:
      tags: [content]
      summary: 获取当前玩家可见的新内容包
      operationId: getContentUpdates
      security:
        - bearerAuth: [content:read]
      x-roles: [player, system]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 返回当前玩家可见的内容更新列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentUpdatesResponse'
              examples:
                success:
                  $ref: '#/components/examples/ContentUpdatesSuccess'
                empty:
                  $ref: '#/components/examples/ContentUpdatesEmptySuccess'
                pageBoundary:
                  $ref: '#/components/examples/ContentUpdatesPageBoundarySuccess'
        '400':
          description: 分页参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPagination:
                  $ref: '#/components/examples/InvalidPaginationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前访问令牌缺少内容查询作用域
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientScope:
                  $ref: '#/components/examples/InsufficientScopeError'
        '503':
          description: 内容更新服务暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                updatesUnavailable:
                  $ref: '#/components/examples/ContentUpdatesUnavailableError'
  /api/v1/content/packages/{content_package_id}:
    get:
      tags: [content]
      summary: 获取内容包摘要
      operationId: getContentPackage
      security:
        - bearerAuth: [content:read]
      x-roles: [player, ops]
      parameters:
        - $ref: '#/components/parameters/ContentPackageId'
      responses:
        '200':
          description: 返回内容包摘要和当前可见状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentPackageResponse'
              examples:
                success:
                  $ref: '#/components/examples/ContentPackageSuccess'
        '400':
          description: 内容包 ID 格式不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidContentPackageId:
                  $ref: '#/components/examples/InvalidContentPackageIdError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 内容包对当前玩家不可见
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                packageNotVisible:
                  $ref: '#/components/examples/ContentPackageNotVisibleError'
        '404':
          description: 内容包不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                packageNotFound:
                  $ref: '#/components/examples/ContentPackageNotFoundError'
  /api/v1/ops/content-packages/{id}/release:
    post:
      tags: [ops, content]
      summary: 发布内容包
      operationId: releaseContentPackage
      security:
        - bearerAuth: [content:release]
      x-roles: [ops]
      parameters:
        - $ref: '#/components/parameters/OpsContentPackageId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseContentPackageRequest'
            examples:
              grayRelease:
                $ref: '#/components/examples/ReleaseContentPackageRequestGray'
      responses:
        '200':
          description: 内容包发布请求受理成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseContentPackageResponse'
              examples:
                grayAccepted:
                  $ref: '#/components/examples/ReleaseContentPackageResponseGray'
                idempotentReplay:
                  $ref: '#/components/examples/ReleaseContentPackageResponseIdempotentReplay'
        '400':
          description: 发布请求参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reasonRequired:
                  $ref: '#/components/examples/ReasonRequiredError'
                invalidGrayScope:
                  $ref: '#/components/examples/InvalidGrayScopeError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前角色无内容发布权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                releaseForbidden:
                  $ref: '#/components/examples/ContentReleaseForbiddenError'
        '404':
          description: 内容包不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                packageNotFound:
                  $ref: '#/components/examples/ContentPackageNotFoundError'
        '409':
          description: 内容包状态与发布操作冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notReleasable:
                  $ref: '#/components/examples/ContentPackageNotReleasableError'
                alreadyLive:
                  $ref: '#/components/examples/ContentPackageAlreadyLiveError'
                serializationRequired:
                  $ref: '#/components/examples/PackageSerializationRequiredError'
  /api/v1/ops/content-packages/{id}/rollback:
    post:
      tags: [ops, content]
      summary: 回滚内容包
      operationId: rollbackContentPackage
      security:
        - bearerAuth: [content:rollback]
      x-roles: [ops]
      parameters:
        - $ref: '#/components/parameters/OpsContentPackageId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackContentPackageRequest'
            examples:
              rollback:
                $ref: '#/components/examples/RollbackContentPackageRequest'
      responses:
        '200':
          description: 内容包回滚请求受理成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackContentPackageResponse'
              examples:
                queued:
                  $ref: '#/components/examples/RollbackContentPackageResponse'
                idempotentReplay:
                  $ref: '#/components/examples/RollbackContentPackageResponseIdempotentReplay'
        '400':
          description: 回滚请求参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rollbackTargetInvalid:
                  $ref: '#/components/examples/RollbackTargetInvalidError'
                reasonRequired:
                  $ref: '#/components/examples/ReasonRequiredError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前角色无内容回滚权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rollbackForbidden:
                  $ref: '#/components/examples/ContentRollbackForbiddenError'
        '404':
          description: 内容包不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                packageNotFound:
                  $ref: '#/components/examples/ContentPackageNotFoundError'
        '409':
          description: 内容包状态与回滚操作冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notRollbackable:
                  $ref: '#/components/examples/ContentPackageNotRollbackableError'
                serializationRequired:
                  $ref: '#/components/examples/PackageSerializationRequiredError'
  /api/v1/world/regions:
    get:
      tags: [world]
      summary: 获取当前可见区域列表
      operationId: getVisibleRegions
      security:
        - bearerAuth: [world:read]
      x-roles: [player, system]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 返回当前玩家可见区域列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionListResponse'
              examples:
                success:
                  $ref: '#/components/examples/RegionListSuccess'
                empty:
                  $ref: '#/components/examples/RegionListEmptySuccess'
                pageBoundary:
                  $ref: '#/components/examples/RegionListPageBoundarySuccess'
        '400':
          description: 分页参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPagination:
                  $ref: '#/components/examples/InvalidPaginationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前访问令牌缺少世界查询作用域
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientScope:
                  $ref: '#/components/examples/InsufficientScopeError'
  /api/v1/world/regions/{region_id}:
    get:
      tags: [world]
      summary: 获取区域详情和状态
      operationId: getRegionDetail
      security:
        - bearerAuth: [world:read]
      x-roles: [player, system]
      parameters:
        - $ref: '#/components/parameters/RegionId'
      responses:
        '200':
          description: 返回区域详情和当前状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionDetailResponse'
              examples:
                success:
                  $ref: '#/components/examples/RegionDetailSuccess'
        '400':
          description: 区域 ID 格式不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRegionId:
                  $ref: '#/components/examples/InvalidRegionIdError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 区域当前对玩家不可见
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                regionNotVisible:
                  $ref: '#/components/examples/RegionNotVisibleError'
        '404':
          description: 区域不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                regionNotFound:
                  $ref: '#/components/examples/RegionNotFoundError'
  /api/v1/quests:
    get:
      tags: [quests]
      summary: 获取玩家任务列表
      operationId: getQuestList
      security:
        - bearerAuth: [quests:read]
      x-roles: [player, system]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 返回玩家任务列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestListResponse'
              examples:
                success:
                  $ref: '#/components/examples/QuestListSuccess'
                empty:
                  $ref: '#/components/examples/QuestListEmptySuccess'
                pageBoundary:
                  $ref: '#/components/examples/QuestListPageBoundarySuccess'
        '400':
          description: 分页参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPagination:
                  $ref: '#/components/examples/InvalidPaginationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前访问令牌缺少任务查询作用域
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientScope:
                  $ref: '#/components/examples/InsufficientScopeError'
        '503':
          description: 任务列表服务暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                questListUnavailable:
                  $ref: '#/components/examples/QuestListUnavailableError'
  /api/v1/ops/vote-cycles:
    post:
      tags: [ops, votes]
      summary: 创建投票周期
      operationId: createVoteCycle
      security:
        - bearerAuth: [ops:vote-cycles:write]
      x-roles: [ops]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoteCycleRequest'
            examples:
              createVoteCycle:
                $ref: '#/components/examples/CreateVoteCycleRequest'
      responses:
        '200':
          description: 投票周期创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVoteCycleResponse'
              examples:
                success:
                  $ref: '#/components/examples/CreateVoteCycleResponse'
                idempotentReplay:
                  $ref: '#/components/examples/CreateVoteCycleIdempotentReplay'
        '400':
          description: 创建投票周期请求参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reasonRequired:
                  $ref: '#/components/examples/ReasonRequiredError'
                invalidRequest:
                  $ref: '#/components/examples/CreateVoteCycleInvalidArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前角色无创建投票周期权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientScope:
                  $ref: '#/components/examples/InsufficientScopeError'
        '409':
          description: 投票周期创建发生冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                voteCycleConflict:
                  $ref: '#/components/examples/VoteCycleConflictError'
  /api/v1/ops/review/{object_id}/approve:
    post:
      tags: [review, ops]
      summary: 批准内容对象
      operationId: approveReviewObject
      security:
        - bearerAuth: [review:approve]
      x-roles: [reviewer, ops]
      parameters:
        - $ref: '#/components/parameters/ReviewObjectId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewApproveRequest'
            examples:
              approve:
                $ref: '#/components/examples/ReviewApproveRequest'
      responses:
        '200':
          description: 审核批准请求受理成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewApproveResponse'
              examples:
                success:
                  $ref: '#/components/examples/ReviewApproveResponse'
                idempotentReplay:
                  $ref: '#/components/examples/ReviewApproveIdempotentReplay'
        '400':
          description: 审核批准请求参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reasonRequired:
                  $ref: '#/components/examples/ReasonRequiredError'
                invalidRequest:
                  $ref: '#/components/examples/ReviewApproveInvalidArgumentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前角色无审核批准权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reviewApprovalForbidden:
