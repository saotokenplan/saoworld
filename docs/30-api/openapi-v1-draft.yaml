  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: INVALID_VOTE_STATE
        message:
          type: string
          example: 当前投票周期不可投票
        request_id:
          type: string
          example: req_vote_current_409
    VoteCycle:
      type: object
      required: [vote_cycle_id, chapter_id, status, starts_at, ends_at]
      properties:
        vote_cycle_id:
          type: string
        chapter_id:
          type: string
        status:
          type: string
          enum: [open, closed, finalized]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    VotePlayerContext:
      type: object
      required: [player_id, eligible, has_voted, vote_weight]
      properties:
        player_id:
          type: string
        eligible:
          type: boolean
        reason:
          type: string
          nullable: true
        has_voted:
          type: boolean
        vote_weight:
          type: number
          format: float
    VoteCandidate:
      type: object
      required: [candidate_id, title, summary, region_scope, risk_tags]
      properties:
        candidate_id:
          type: string
        title:
          type: string
        summary:
          type: string
        region_scope:
          type: array
          items:
            type: string
        risk_tags:
          type: array
          items:
            type: string
    VoteCurrentResponse:
      type: object
      required: [request_id, vote_cycle, player_context, candidates]
      properties:
        request_id:
          type: string
        vote_cycle:
          $ref: '#/components/schemas/VoteCycle'
        player_context:
          $ref: '#/components/schemas/VotePlayerContext'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/VoteCandidate'
    VoteSubmitRequest:
      type: object
      required: [vote_cycle_id, candidate_id]
      properties:
        vote_cycle_id:
          type: string
        candidate_id:
          type: string
    VoteSubmitResponse:
      type: object
      required: [request_id, vote_id, vote_cycle_id, candidate_id, accepted, submitted_at]
      properties:
        request_id:
          type: string
        vote_id:
          type: string
        vote_cycle_id:
          type: string
        candidate_id:
          type: string
        accepted:
          type: boolean
        weight:
          type: number
          format: float
        idempotent_replay:
          type: boolean
          default: false
        submitted_at:
          type: string
          format: date-time
    VoteHistoryCandidate:
      type: object
      required: [candidate_id, title, vote_percent]
      properties:
        candidate_id:
          type: string
        title:
          type: string
        vote_percent:
          type: number
          format: float
    VoteHistoryDelivery:
      type: object
      required: [status, content_package_id, affected_regions]
      properties:
        status:
          type: string
          enum: [pending, gray, live, rolled_back]
        content_package_id:
          type: string
        affected_regions:
          type: array
          items:
            type: string
    VoteHistoryItem:
      type: object
      required:
        [vote_cycle_id, chapter_id, closed_at, winner_candidate_id, winner_title, total_votes, candidates, delivery]
      properties:
        vote_cycle_id:
          type: string
        chapter_id:
          type: string
        closed_at:
          type: string
          format: date-time
        winner_candidate_id:
          type: string
        winner_title:
          type: string
        total_votes:
          type: integer
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/VoteHistoryCandidate'
        delivery:
          $ref: '#/components/schemas/VoteHistoryDelivery'
    VoteHistoryResponse:
      type: object
