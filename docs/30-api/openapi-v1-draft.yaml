components:
  securitySchemes:
    bearerAuth:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration
      description: >
        Bearer Token 采用 OIDC Access Token 语义；各接口通过 security 显式声明
        所需 scope，并通过 x-roles 标注允许角色集合。
      x-scopes:
        votes:read: 查询当前投票周期与候选项
        votes:submit: 提交玩家投票
        votes:history:read: 查询历史投票结果
        content:read: 查询内容更新与内容包摘要
        content:release: 发布内容包
        content:rollback: 回滚内容包
        world:read: 查询世界区域
        quests:read: 查询玩家任务列表
        ops:vote-cycles:write: 创建投票周期
        review:approve: 批准审核对象
  headers:
    X-Request-Id:
      description: 服务端生成的请求追踪 ID
      schema:
        type: string
    X-Trace-Id:
      description: 链路追踪 ID；由调用方透传或由网关生成
      schema:
        type: string
    Idempotency-Key:
      description: 提交投票时的幂等键
      schema:
        type: string
  parameters:
    ChapterId:
      name: chapter_id
      in: query
      required: false
      schema:
        type: string
      description: 按章节过滤历史投票结果
    ContentPackageId:
      name: content_package_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^pkg_[A-Za-z0-9_]+$'
      description: 内容包 ID
    RegionId:
      name: region_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^region_[A-Za-z0-9_]+$'
      description: 区域 ID
    ReviewObjectId:
      name: object_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^object_[A-Za-z0-9_]+$'
      description: 审核对象 ID
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
      description: 幂等键，同一业务请求重试时必须保持一致
    TraceIdHeader:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
      description: 可选链路追踪 ID；若未传入由网关生成并透传
    OpsContentPackageId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^pkg_[A-Za-z0-9_]+$'
      description: 运营接口中的内容包 ID
    RegionIdFilter:
      name: region_id
      in: query
      required: false
      schema:
        type: string
      description: 按区域过滤列表结果
    VoteCycleIdFilter:
      name: vote_cycle_id
      in: query
      required: false
      schema:
        type: string
      description: 按投票周期过滤历史结果
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 页码，从 1 开始
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 分页大小，取值范围 1-100
  responses:
    BadRequest:
      description: 请求参数或请求体不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_ARGUMENT
            message: 请求参数不合法
