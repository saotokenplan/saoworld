        items:
          type: array
          items:
            $ref: '#/components/schemas/VoteHistoryItem'
    ContentUpdateItem:
      type: object
      required: [content_package_id, published_at, affected_regions, gray_visible]
      properties:
        content_package_id:
          type: string
        title:
          type: string
        summary:
          type: string
        published_at:
          type: string
          format: date-time
        affected_regions:
          type: array
          items:
            type: string
        gray_visible:
          type: boolean
    ContentUpdatesResponse:
      type: object
      required: [request_id, items]
